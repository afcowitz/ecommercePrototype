<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NODEX — Tech Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="wrap nav">
  <a href="#/" class="brand"><i></i>NODEX</a>
  <nav id="mainnav"></nav>
  <span class="sp"></span>
  <button class="ibtn" data-act="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  <a class="ibtn" id="acct" href="#/account">Account</a>
  <button class="ibtn" data-act="drawer" aria-label="Open cart">Cart <span class="badge" id="cc">0</span></button>
</div></header>
<div id="demobar" class="demobar" hidden>Demonstration mode: all data is stored only in this browser, no real orders are placed, and nothing is shared. <button class="link" data-act="resetdemo">Reset demo data</button></div>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><span>NODEX — prototype storefront. Placeholder products and prices.</span><span class="mono">Front-end build v0.1</span></div></footer>
<div class="ov" id="ov" data-act="closeall"></div>
<aside id="drawer" aria-label="Cart"></aside>
<div id="modal"></div>
<div id="toast"></div>

<!-- Supabase client library (pinned version) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<!-- Application scripts: order matters (each file uses the ones above it) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/art.js"></script>
<script src="js/backend-supabase.js"></script>
<script src="js/backend-demo.js"></script>
<script src="js/backend.js"></script>
<script src="js/state.js"></script>
<script src="js/views-store.js"></script>
<script src="js/views-account.js"></script>
<script src="js/views-admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
